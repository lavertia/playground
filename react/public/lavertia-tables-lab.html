-width:190px}.empty{padding:58px 20px;text-align:center}.empty h3{font-size:16px;margin:12px 0 5px}.empty p{margin:0 0 18px;color:var(--muted)}.skeleton{height:14px;max-width:95%;background:var(--border);border-radius:7px;animation:pulse 1.3s infinite alternate}.round-skeleton{border-radius:50%;width:27px;height:27px;background:var(--border)}@keyframes pulse{to{opacity:.32}}.overlay{position:fixed;inset:0;z-index:60;background:#000b;display:flex;justify-content:center;align-items:center;padding:18px}.modal{width:min(460px,96vw);background:var(--card);border:1px solid var(--border);border-radius:14px;padding:23px;box-shadow:var(--shadow)}.modal h2{font-size:19px;text-align:center;margin:12px 0 6px}.modal p{color:var(--muted);text-align:center}.modal .warn-icon{background:#7f1d1d66;color:#f87171;border-radius:50%;width:51px;height:51px;margin:0 auto;display:grid;place-items:center}.modal .buttons{display:flex;gap:9px;margin-top:24px}.modal .buttons .btn{flex:1}.modal .label{display:block;margin:13px 0 6px;font-weight:600;font-size:12px}.modal input,.modal select{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:8px;width:100%;padding:10px}.modal .destructive{background:#dc2626;color:white;border-color:#dc2626}.toast{position:fixed;right:21px;bottom:20px;background:var(--head);border:1px solid var(--border);border-radius:9px;padding:12px 17px;font-size:13px;z-index:70;box-shadow:var(--shadow)}.note{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:12px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

<script>
(()=>{
'use strict';
const names=['Dan Harrin','Ryan Chandler','Zep Fietje','Dennis Koch','Adam Weston','Nora Haddad','Maya Saad','Karim Issa','Sara Nassar','Lina Mansour','Omar Jaber','Hala Daher','Tarek Habib','Dima Saleh','Rami Khoury','Youssef Nasr','Nadine Saleh','Lea Bitar','Fadi Mansour','Rana Khalil','Bilal Abbas','Rita Salameh','Samir Haddad','Yara Farah','Pierre Saad'];
const titles=['What is Filament?','Top 5 best features of Filament','Tips for building a great Filament plugin',"Customizing Filament's UI with a theme",'New Filament plugins in August','A Deep Dive into Table Filters','API Tokens for Integrations','Accessible Admin Interfaces','Audit Trails with Model Events','Authorization Patterns in Panels','Making your application multilingual','Record pages and customizable forms','Customizing Table Actions','Dashboard Widgets Guide','A better developer experience'];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const users=Array.from({length:51},(_,i)=>{const name=names[i%names.length];const prefix=name.toLowerCase().split(' ')[0];return{id:i+1,name,email:prefix+(i>24?i:'')+'@filamentphp.com',verified:i%5!==1&&i%5!==2,department:['Engineering','Design','Operations','Sales'][i%4],role:['Admin','Editor','Member'][i%3]}});
const posts=Array.from({length:50},(_,i)=>({id:i+1,title:i<titles.length?titles[i]:'Building Laravel dashboards — part '+(i-14),slug:i<5?['what-is-filament','top-5-features','plugin-tips','theme-guide','new-plugins-august'][i]:slug(i<titles.length?titles[i]:'building-laravel-dashboards-part-'+(i-14)),status:['published','reviewing','draft','reviewing','published'][i%5],author:names[i%names.length],featured:i%3===0}));
const icons={search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',filter:'<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',columns:'<rect x="2.5" y="3" width="5" height="18" rx="1"/><rect x="9.5" y="3" width="5" height="18" rx="1"/><rect x="16.5" y="3" width="5" height="18" rx="1"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m4 12 5 5L20 6"/>',x:'<path d="M5 5l14 14M19 5 5 19"/>',chevron:'<path d="m6 9 6 6 6-6"/>',right:'<path d="m9 5 7 7-7 7"/>',left:'<path d="m15 5-7 7 7 7"/>',first:'<path d="m17 5-7 7 7 7M6 5v14"/>',last:'<path d="m7 5 7 7-7 7M18 5v14"/>',edit:'<path d="M4 20h4l11-11-4-4L4 16v4zM13 7l4 4"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',moon:'<path d="M20 15A8 8 0 0 1 9 4a8 8 0 1 0 11 11Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4 4l2 2m12 12 2 2M2 12h2m16 0h2M4 20l2-2M18 6l2-2"/>',grip:'<path d="M4 8h16M4 16h16"/>',sort:'<path d="m7 10 5-5 5 5M7 14l5 5 5-5"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/>',users:'<circle cx="12" cy="8" r="3"/><path d="M5 21v-3c0-4 14-4 14 0v3"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6 6l2 2m8 8 2 2M18 6l-2 2m-8 8-2 2"/>',dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
const svg=(n,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||''}</svg>`;
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const $=s=>document.querySelector(s);
const state={tab:'users',theme:'dark',rtl:false,search:'',group:'',sort:'',desc:false,filterOpen:false,colOpen:false,settingsOpen:false,bulkOpen:false,filter:{status:'',featured:false,verified:''},draftFilter:{status:'',featured:false,verified:''},selected:new Set(),page:1,perPage:5,pagination:'numbers',columns:{users:['name','email','verified'],posts:['title','status','author']},compact:false,striped:false,colored:false,reorder:false,loading:false,modal:null,collapse:new Set(),toast:''};
const tabs=[['users','Users'],['posts','Blog posts'],['reorder','Drag & reorder'],['bulk','Bulk actions'],['loading','Skeleton loading'],['empty','Empty state']];
const isUsers=()=>state.tab==='users';const isPosts=()=>!isUsers();const baseRows=()=>isUsers()?users:posts;
const opts=()=>isUsers()?{name:'Name',email:'Email address',verified:'Verified',department:'Department',role:'Role'}:{title:'Title',slug:'Slug',status:'Status',author:'Author',featured:'Is featured'};
const resetViews=()=>{state.filter={status:'',featured:false,verified:''};state.draftFilter={...state.filter};state.search='';state.group='';state.page=1;state.selected.clear();state.collapse.clear();state.filterOpen=false;state.colOpen=false;state.settingsOpen=false;state.bulkOpen=false;state.reorder=state.tab==='reorder';state.loading=state.tab==='loading';state.colored=false;state.striped=false;state.compact=false;state.sort='';state.columns.posts=state.tab==='reorder'?['title','slug','author','status']:state.tab==='bulk'?['title','slug','featured','author']:['title','status','author'];};
const isFiltered=()=>!!(state.filter.status||state.filter.featured||state.filter.verified);
function filteredRows(){if(state.tab==='empty')return [];let a=[...baseRows()];if(state.search.trim()){const q=state.search.trim().toLowerCase();a=a.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));}if(isUsers()){if(state.filter.verified!=='')a=a.filter(r=>r.verified===(state.filter.verified==='yes'));}else{if(state.filter.status)a=a.filter(r=>r.status===state.filter.status);if(state.filter.featured)a=a.filter(r=>r.featured);}if(!state.reorder&&state.sort){a.sort((x,y)=>{let ax=x[state.sort],ay=y[state.sort];return(String(ax??'').localeCompare(String(ay??''),undefined,{numeric:true}))*(state.desc?-1:1)})}return a;}
function pageRows(filtered){return filtered.slice((state.page-1)*state.perPage,state.page*state.perPage)}
function pageNav(total){const totalPages=Math.max(1,Math.ceil(total/state.perPage));state.page=Math.max(1,Math.min(totalPages,state.page));let out='';const disabledPrev=state.page<=1?'disabled':'';const disabledNext=state.page>=totalPages?'disabled':'';const prev=`<button type="button" data-action="page" data-page="${state.page-1}" aria-label="Previous page" ${disabledPrev}>${svg('left',15)}</button>`;const next=`<button type="button" data-action="page" data-page="${state.page+1}" aria-label="Next page" ${disabledNext}>${svg('right',15)}</button>`;if(state.pagination==='simple'||state.pagination==='cursor'){out=`${prev}<button disabled>${state.pagination==='cursor'?'Cursor':`Page ${state.page} / ${totalPages}`}</button>${next}`;}else{let arr=totalPages<=7?Array.from({length:totalPages},(_,i)=>i+1):[1,2,3,4,'…',totalPages-1,totalPages];if(state.page>4&&totalPages>7)arr=[1,'…',state.page-1,state.page,state.page+1,'…',totalPages].filter((p,i,a)=>typeof p==='string'||(p>=1&&p<=totalPages&&a.indexOf(p)===i));out=arr.map(p=>typeof p==='string'?`<button disabled>…</button>`:`<button type="button" class="${p===state.page?'active':''}" aria-current="${p===state.page?'page':'false'}" data-action="page" data-page="${p}">${p}</button>`).join('')+next;}return `<nav aria-label="Table pagination" class="pages">${out}</nav>`;}
function dropdowns(){let s='';if(state.filterOpen){s+=`<div class="popup" role="group" aria-label="Filters panel"><div class="flex-title"><h3>Filters</h3><button type="button" class="btn ghost danger small" data-action="reset-filter">Reset</button></div>`;if(isUsers()){s+=`<label for="flt-verified">Verified</label><select id="flt-verified" data-change="draft-verified"><option value="" ${state.draftFilter.verified===''?'selected':''}>All users</option><option value="yes" ${state.draftFilter.verified==='yes'?'selected':''}>Verified</option><option value="no" ${state.draftFilter.verified==='no'?'selected':''}>Not verified</option></select>`;}else{s+=`<label><input class="checks" type="checkbox" data-change="draft-featured" ${state.draftFilter.featured?'checked':''}>Is featured</label><label for="flt-status">Status</label><select id="flt-status" data-change="draft-status"><option value="" ${!state.draftFilter.status?'selected':''}>All</option><option value="published" ${state.draftFilter.status==='published'?'selected':''}>Published</option><option value="reviewing" ${state.draftFilter.status==='reviewing'?'selected':''}>Reviewing</option><option value="draft" ${state.draftFilter.status==='draft'?'selected':''}>Draft</option></select>`;}s+=`<div class="foot"><button type="button" class="btn primary" data-action="apply-filters">Apply filters</button></div></div>`;}return s;}
function colDropdown(){if(!state.colOpen)return '';let defs=opts();let visible=state.columns[isUsers()?'users':'posts'];return `<div class="popup columns-pop" role="group" aria-label="Columns manager"><div class="flex-title"><h3>Columns</h3><button class="btn ghost small" data-action="reset-columns">Reset</button></div>${Object.entries(defs).map(([key,label])=>`<div class="col-opt"><label><input class="checks" data-change="column" data-key="${key}" type="checkbox" ${visible.includes(key)?'checked':''} ${visible.includes(key)&&visible.length===1?'disabled':''}>${esc(label)}</label><button type="button" class="mini" data-action="colmove" data-key="${key}" data-step="-1" aria-label="Move ${esc(label)} left">↑</button><button type="button" class="mini" data-action="colmove" data-key="${key}" data-step="1" aria-label="Move ${esc(label)} right">↓</button></div>`).join('')}</div>`;}
function settingsDropdown(){if(!state.settingsOpen)return '';return `<div class="popup" role="group" aria-label="Table options"><h3>Table options</h3><label><input type="checkbox" class="checks" data-change="compact" ${state.compact?'checked':''}>Compact rows</label><label><input type="checkbox" class="checks" data-change="striped" ${state.striped?'checked':''}>Striped rows</label><label><input type="checkbox" class="checks" data-change="colored" ${state.colored?'checked':''}>Color rows by status</label><label><input type="checkbox" class="checks" data-change="reorder" ${state.reorder?'checked':''}>Reorder records (demo)</label><label for="paginate-mode">Pagination mode</label><select id="paginate-mode" data-change="pagination"><option ${state.pagination==='numbers'?'selected':''} value="numbers">Numbered pages</option><option ${state.pagination==='simple'?'selected':''} value="simple">Simple previous / next</option><option ${state.pagination==='cursor'?'selected':''} value="cursor">Cursor-style preview</option></select><label><input type="checkbox" class="checks" data-change="loading" ${state.loading?'checked':''}>Loading skeleton</label><p class="caption">All edits here are local demo state only.</p></div>`;}
function bulkDropdown(){if(!state.bulkOpen||state.selected.size===0)return '';return `<div class="popup" role="group" aria-label="Bulk actions"><h3>${state.selected.size} selected</h3><button class="btn danger" style="width:100%;justify-content:flex-start" data-action="bulk-delete">${svg('trash')}Delete selected</button><button class="btn" style="margin-top:8px;width:100%;justify-content:flex-start" data-action="bulk-feature">${svg('check')}Feature selected</button></div>`;}
function renderToolbar(){const isR=state.reorder;let groupOpt=isUsers()?['verified','department','role']:['status','author'];const selectedSize=state.selected.size;let groupText=state.group||'-';return `<div class="toolbar"><div class="toolbar-left">${isR?`<button type="button" class="btn" data-action="reorder">${svg('check')}Disable reordering</button>`:`<div class="split"><span>Group by</span><select aria-label="Group by" data-change="group"><option value="" ${!state.group?'selected':''}>-</option>${groupOpt.map(g=>`<option value="${g}" ${state.group===g?'selected':''}>${g[0].toUpperCase()+g.slice(1)}</option>`).join('')}</select></div>`}${selectedSize?`<div class="popup-anchor"><button class="btn" type="button" data-action="bulk-menu">${svg('dots')}Bulk actions (${selectedSize})</button>${bulkDropdown()}</div>`:''}${!isR&&!selectedSize&&state.tab==='reorder'?`<button class="btn" data-action="reorder">Enable reordering</button>`:''}</div><div class="toolbar-right"><label class="search">${svg('search',19)}<input id="search-field" autocomplete="off" type="search" value="${esc(state.search)}" placeholder="Search" aria-label="Search ${isUsers()?'users':'posts'}" ${state.loading?'disabled':''}></label><div class="popup-anchor toolicon"><button class="btn ghost iconbtn" type="button" data-action="filters" aria-label="Filters" aria-expanded="${state.filterOpen}">${svg('filter',21)}</button><span class="counter">${isFiltered()?Object.values(state.filter).filter(Boolean).length:0}</span>${dropdowns()}</div><div class="popup-anchor"><button class="btn ghost iconbtn" type="button" aria-label="Manage columns" aria-expanded="${state.colOpen}" data-action="columns">${svg('columns',20)}</button>${colDropdown()}</div><div class="popup-anchor"><button class="btn ghost iconbtn" type="button" aria-label="Table options" aria-expanded="${state.settingsOpen}" data-action="settings">${svg('settings',20)}</button>${settingsDropdown()}</div></div></div>`;}
function headRow(cols,checkable){return `<thead><tr>${state.reorder?'<th style="width:43px"><span class="sr">Reorder</span></th>':checkable?`<th style="width:42px"><input type="checkbox" class="checks" data-change="select-page" aria-label="Select all rows on current page" ${pageRows(filteredRows()).every(r=>state.selected.has(r.id))&&pageRows(filteredRows()).length?'checked':''}></th>`:''}${cols.map(k=>{let label=opts()[k];return `<th scope="col" aria-sort="${state.sort===k?state.desc?'descending':'ascending':'none'}">${state.reorder?esc(label):`<button type="button" class="sort" data-action="sort" data-key="${k}">${esc(label)}${svg('sort',14)}</button>`}</th>`}).join('')}<th style="width:145px;text-align:right"><span class="sr">Actions</span></th></tr></thead>`;}
function rowCell(r,k){switch(k){case 'verified':return r.verified?`<span class="ok" aria-label="Verified">${svg('check',22)}</span>`:`<span class="no" aria-label="Not verified">${svg('x',22)}</span>`;case 'featured':return r.featured?`<span class="ok" aria-label="Featured">${svg('check',22)}</span>`:`<span class="no" aria-label="Not featured">${svg('x',22)}</span>`;case 'status':return `<span class="badge ${r.status}">${esc(r.status)}</span>`;case 'name':return `<span class="avatar">${esc(r.name.split(' ').map(s=>s[0]).slice(0,2).join(''))}</span>${esc(r.name)}`;default:return `<span dir="auto">${esc(r[k])}</span>`;}}
function rowMarkup(r,cols,checkable){const checked=state.selected.has(r.id);let tint=state.colored&&!isUsers()?`tint-${r.status}`:'';return `<tr draggable="${state.reorder&&!isUsers()}" data-row="${r.id}" class="${tint}">${state.reorder?`<td><button type="button" class="grip" data-action="move" data-id="${r.id}" title="Use drag-and-drop, or keyboard move down" aria-label="Move record down">${svg('grip',22)}</button></td>`:checkable?`<td><input type="checkbox" class="checks" data-change="select-row" data-id="${r.id}" aria-label="Select ${esc(isUsers()?r.name:r.title)}" ${checked?'checked':''}></td>`:''}${cols.map(k=>`<td>${rowCell(r,k)}</td>`).join('')}<td><div class="row-actions"><button class="btn small" type="button" data-action="edit" data-id="${r.id}">${svg('edit',13)}Edit</button><button class="btn small danger" type="button" data-action="delete" data-id="${r.id}" aria-label="Delete record">${svg('trash',14)}</button></div></td></tr>`;}
function renderBody(){let rows=filteredRows();let totalPages=Math.max(1,Math.ceil(rows.length/state.perPage));state.page=Math.min(state.page,totalPages);let paged=pageRows(rows);const key=isUsers()?'users':'posts';const cols=state.columns[key];const checkable=!state.reorder;let hasSelection=state.selected.size>0;let content='';if(state.loading){content=`<tbody>${Array.from({length:5},()=>`<tr>${(checkable?'<td><span class="skeleton" style="display:block;width:16px"></span></td>':'')}${cols.map((_,i)=>`<td><div class="skeleton" style="width:${[150,220,110,175][i%4]}px"></div></td>`).join('')}<td><div class="skeleton" style="width:60px"></div></td></tr>`).join('')}</tbody>`;}else if(!rows.length){content=`<tbody><tr><td colspan="${cols.length+2}" class="empty"><div>${svg('search',30)}</div><h3>No records found</h3><p>${state.search||isFiltered()?'Try changing your search or filters.':'This table currently has no records.'}</p><button class="btn" data-action="reset-search">Clear search & filters</button></td></tr></tbody>`;}else{let group=state.group&&!state.reorder?state.group:'';if(group){let groups=new Map();for(let r of paged){let label=String(r[group]??'-');if(group==='verified')label=r.verified?'Verified':'Not verified';if(!groups.has(label))groups.set(label,[]);groups.get(label).push(r)}content='<tbody>'+Array.from(groups.entries()).map(([label,items])=>`<tr class="group-row"><td colspan="${cols.length+2}"><button data-action="collapse" data-key="${esc(label)}" type="button">${state.collapse.has(label)?'▸':'▾'} ${esc(label)} (${items.length})</button></td></tr>${state.collapse.has(label)?'':items.map(r=>rowMarkup(r,cols,checkable)).join('')}`).join('')+'</tbody>';}else content='<tbody>'+paged.map(r=>rowMarkup(r,cols,checkable)).join('')+'</tbody>';}
const banner=hasSelection&&!state.reorder?`<div class="select-banner"><strong>${state.selected.size} selected</strong><button class="link" data-action="select-all" type="button">Select all ${rows.length} matching records</button><button class="link" data-action="clear-selection" type="button">Deselect all</button></div>`:'';const rangeStart=rows.length?(state.page-1)*state.perPage+1:0;const rangeEnd=Math.min(rows.length,state.page*state.perPage);return `${banner}${state.reorder?`<div class="reorder-banner">Drag and drop records into order. Use the handle to move a row down with the keyboard.</div>`:''}<div class="table-wrap"><table class="${state.compact?'compact':''} ${state.striped?'stripe':''}">${headRow(cols,checkable)}${content}</table></div><footer class="table-footer"><div class="footer-range" aria-live="polite">Showing ${rangeStart} to ${rangeEnd} of ${rows.length} results</div><div class="footer-center"><div class="split"><span>Per page</span><select aria-label="Rows per page" data-change="per-page">${[5,10,25,50].map(n=>`<option ${state.perPage===n?'selected':''} value="${n}">${n}</option>`).join('')}</select></div></div>${pageNav(rows.length)}</footer>`;}
function renderDialog(){if(!state.modal)return '';let m=state.modal;let isDelete=m.type==='delete'||m.type==='bulk-delete';let r=m.id?baseRows().find(x=>x.id===m.id):null;let title=m.type==='create'?`New ${isUsers()?'user':'post'}`:m.type==='edit'?`Edit ${isUsers()?'user':'post'}`:m.type==='bulk-delete'?'Delete selected Posts':`Delete ${isUsers()?'user':'post'}`;let fields='';if(!isDelete){fields=isUsers()?`<label class="label" for="field-name">Full name</label><input required name="name" id="field-name" value="${esc(r?.name??'')}" maxlength="120"><label class="label" for="field-email">Email address</label><input required name="email" id="field-email" type="email" value="${esc(r?.email??'')}"><label class="label" for="field-verified">Verified</label><select name="verified" id="field-verified"><option value="yes" ${r?.verified?'selected':''}>Yes</option><option value="no" ${!r?.verified?'selected':''}>No</option></select>`:`<label class="label" for="field-title">Title</label><input required name="title" id="field-title" maxlength="160" value="${esc(r?.title??'')}"><label class="label" for="field-status">Status</label><select name="status" id="field-status">${['draft','reviewing','published'].map(x=>`<option value="${x}" ${r?.status===x?'selected':''}>${x}</option>`).join('')}</select><label class="label" for="field-author">Author</label><input required name="author" id="field-author" value="${esc(r?.author??'Dan Harrin')}">`;}return `<div class="overlay" data-action="close-backdrop"><form class="modal" id="record-form" role="dialog" aria-modal="true" aria-label="${esc(title)}">${isDelete?`<div class="warn-icon">${svg('trash',26)}</div>`:''}<h2>${esc(title)}</h2>${isDelete?`<p>Are you sure you would like to do this? ${m.type==='bulk-delete'?`${state.selected.size} records will be removed from this demo.`:''}</p>`:fields}<div class="buttons"><button type="button" class="btn" data-action="close-modal">Cancel</button><button type="submit" class="btn ${isDelete?'destructive':'primary'}">${isDelete?'Delete':m.type==='create'?'Create':'Save changes'}</button></div></form></div>`;}
function render(){const user=isUsers();const title=user?'Users':state.tab==='loading'?'Team members':'Blog Posts';const description=user?'Individuals who have registered for the application.':state.tab==='loading'?'Manage your team and their account access.':'Manage your blog posts and articles.';$('#app').innerHTML=`<div class="top"><div><div class="kicker">Lavertia / Component Lab</div><h1>Tables interaction lab</h1><p class="sub">Filament 5-inspired behavior · Local sample data · No server-side writes</p></div><div class="top-tools"><span class="demo-tag">Interactive prototype</span><button type="button" data-action="rtl" class="btn iconbtn" aria-label="Toggle RTL" title="Toggle RTL">${state.rtl?'LTR':'RTL'}</button><button type="button" data-action="theme" class="btn iconbtn" aria-label="Toggle color theme" title="Toggle light / dark">${svg(state.theme==='dark'?'sun':'moon',18)}</button><button type="button" data-action="reset-all" class="btn">Reset demo</button></div></div><nav class="tabs" aria-label="Table demos">${tabs.map(([id,label])=>`<button type="button" data-action="tab" data-tab="${id}" aria-current="${id===state.tab?'page':'false'}" class="tab ${id===state.tab?'active':''}">${label}</button>`).join('')}</nav><section class="main-card"><div class="main-head"><div><h2>${title}</h2><p>${description}</p></div><button type="button" class="btn primary" data-action="create">${svg('plus',15)} ${user?'New user':'New post'}</button></div>${renderToolbar()}${renderBody()}</section><div class="note">${svg('alert',15)} Sample dataset: ${baseRows().length} records. Search, filters, edits, delete, reordering and bulk actions run only in this browser tab.</div>${renderDialog()}${state.toast?`<div class="toast" role="status">${esc(state.toast)} <button class="mini" data-action="clear-toast">${svg('x',13)}</button></div>`:''}`;document.documentElement.dataset.theme=state.theme;document.documentElement.dir=state.rtl?'rtl':'ltr';document.documentElement.lang=state.rtl?'ar':'en';}
function message(msg){state.toast=msg;}
function applyTab(tab){state.tab=tab;resetViews();render();}
function change(e){let name=e.target.dataset.change;if(!name)return;switch(name){case 'group':state.group=e.target.value;state.page=1;break;case 'select-row':{let id=Number(e.target.dataset.id);e.target.checked?state.selected.add(id):state.selected.delete(id);break;}case 'select-page':for(let r of pageRows(filteredRows())){e.target.checked?state.selected.add(r.id):state.selected.delete(r.id);}break;case 'column':{let list=state.columns[isUsers()?'users':'posts'];let key=e.target.dataset.key;if(e.target.checked){if(!list.includes(key))list.push(key);}else if(list.length>1)list.splice(list.indexOf(key),1);break;}case 'draft-featured':state.draftFilter.featured=e.target.checked;break;case 'draft-status':state.draftFilter.status=e.target.value;break;case 'draft-verified':state.draftFilter.verified=e.target.value;break;case 'compact':state.compact=e.target.checked;break;case 'striped':state.striped=e.target.checked;break;case 'colored':state.colored=e.target.checked;break;case 'reorder':state.reorder=e.target.checked;state.selected.clear();state.group='';state.page=1;break;case 'loading':state.loading=e.target.checked;break;case 'pagination':state.pagination=e.target.value;break;case 'per-page':state.perPage=Number(e.target.value);state.page=1;break;}render();}
function action(button){let a=button.dataset.action;if(!a)return;const id=Number(button.dataset.id),k=button.dataset.key;switch(a){case 'theme':state.theme=state.theme==='dark'?'light':'dark';break;case 'rtl':state.rtl=!state.rtl;break;case 'reset-all':users.splice(0,users.length,...initialUsers);posts.splice(0,posts.length,...initialPosts);state.perPage=5;state.pagination='numbers';state.tab='users';resetViews();message('Demo reset successfully');break;case 'tab':applyTab(button.dataset.tab);return;case 'sort':if(state.sort===k)state.desc=!state.desc;else{state.sort=k;state.desc=false;}state.page=1;break;case 'page':state.page=Number(button.dataset.page);state.bulkOpen=false;break;case 'filters':state.filterOpen=!state.filterOpen;state.colOpen=false;state.settingsOpen=false;state.bulkOpen=false;break;case 'columns':state.colOpen=!state.colOpen;state.filterOpen=false;state.settingsOpen=false;state.bulkOpen=false;break;case 'settings':state.settingsOpen=!state.settingsOpen;state.colOpen=false;state.filterOpen=false;state.bulkOpen=false;break;case 'bulk-menu':state.bulkOpen=!state.bulkOpen;state.filterOpen=false;state.colOpen=false;break;case 'reset-filter':state.filter={status:'',featured:false,verified:''};state.draftFilter={...state.filter};state.page=1;break;case 'apply-filters':state.filter={...state.draftFilter};state.page=1;state.filterOpen=false;state.selected.clear();break;case 'colmove':{const list=state.columns[isUsers()?'users':'posts'];const i=list.indexOf(k),j=i+Number(button.dataset.step);if(i!==-1&&j>=0&&j<list.length)[list[i],list[j]]=[list[j],list[i]];break;}case 'reset-columns':state.columns[isUsers()?'users':'posts']=isUsers()?['name','email','verified']:['title','status','author'];break;case 'clear-selection':state.selected.clear();break;case 'select-all':state.selected=new Set(filteredRows().map(r=>r.id));break;case 'create':state.modal={type:'create'};break;case 'edit':state.modal={type:'edit',id};break;case 'delete':state.modal={type:'delete',id};break;case 'bulk-delete':state.modal={type:'bulk-delete'};break;case 'bulk-feature':{if(isUsers()){for(const r of users){if(state.selected.has(r.id))r.verified=true;}}else{for(const r of posts){if(state.selected.has(r.id))r.featured=true;}}message(`${state.selected.size} records updated locally`);state.selected.clear();state.bulkOpen=false;break;}case 'close-modal':state.modal=null;break;case 'close-backdrop':if(button.classList.contains('overlay'))state.modal=null;break;case 'clear-toast':state.toast='';break;case 'reset-search':state.search='';state.filter={status:'',featured:false,verified:''};state.draftFilter={...state.filter};state.page=1;break;case 'reorder':state.reorder=!state.reorder;state.page=1;state.group='';break;case 'move':{let idx=posts.findIndex(r=>r.id===id);if(idx>=0&&idx<posts.length-1){[posts[idx],posts[idx+1]]=[posts[idx+1],posts[idx]];message('Row order changed in this demo');}break;}case 'collapse':state.collapse.has(k)?state.collapse.delete(k):state.collapse.add(k);break;}render();}
const initialUsers=users.map(x=>({...x})),initialPosts=posts.map(x=>({...x}));
$('#app').addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!(el.dataset.action==='close-backdrop'&&e.target!==el))action(el);});
$('#app').addEventListener('change',change);
$('#app').addEventListener('input',e=>{if(e.target.id==='search-field'){const start=e.target.selectionStart,end=e.target.selectionEnd;state.search=e.target.value;state.page=1;render();const el=$('#search-field');if(el){el.focus();try{el.setSelectionRange(start,end)}catch(_){}}}});
$('#app').addEventListener('submit',e=>{if(e.target.id!=='record-form')return;e.preventDefault();const m=state.modal;if(!m)return;const arr=baseRows();if(m.type==='bulk-delete'){const ids=state.selected;for(let i=arr.length-1;i>=0;i--)if(ids.has(arr[i].id))arr.splice(i,1);message(`${ids.size} demo records deleted`);state.selected.clear();}else if(m.type==='delete'){const i=arr.findIndex(r=>r.id===m.id);if(i!==-1)arr.splice(i,1);state.selected.delete(m.id);message('Demo record deleted');}else{const fd=new FormData(e.target);const name=isUsers()?String(fd.get('name')||'').trim():String(fd.get('title')||'').trim();if(!name)return;let r=m.type==='edit'?arr.find(x=>x.id===m.id):null;if(!r){r={id:Math.max(0,...arr.map(x=>x.id))+1};arr.unshift(r);}if(isUsers()){r.name=name;r.email=String(fd.get('email')||'').trim();r.verified=fd.get('verified')==='yes';r.department=r.department||'Engineering';r.role=r.role||'Member';}else{r.title=name;r.slug=slug(name);r.status=String(fd.get('status')||'draft');r.author=String(fd.get('author')||'Dan Harrin');r.featured=r.featured??false;}message('Demo record saved');}state.modal=null;state.page=1;render();});
let draggedId=null;$('#app').addEventListener('dragstart',e=>{const tr=e.target.closest('tr[draggable="true"]');if(!tr)return;draggedId=Number(tr.dataset.row);e.dataTransfer.effectAllowed='move';});$('#app').addEventListener('dragover',e=>{if(e.target.closest('tr[draggable="true"]'))e.preventDefault();});$('#app').addEventListener('drop',e=>{const target=e.target.closest('tr[draggable="true"]');if(!target||!draggedId)return;e.preventDefault();let from=posts.findIndex(r=>r.id===draggedId),to=posts.findIndex(r=>r.id===Number(target.dataset.row));if(from>=0&&to>=0&&from!==to){let [r]=posts.splice(from,1);posts.splice(to,0,r);message('Drag-and-drop order changed locally');}draggedId=null;render();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.filterOpen||state.colOpen||state.settingsOpen||state.bulkOpen)){state.modal=null;state.filterOpen=false;state.colOpen=false;state.settingsOpen=false;state.bulkOpen=false;render();}});
render();
})();
</script>
</body>
