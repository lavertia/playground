name: Playground CI

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v0.*"]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifests and PHP
        run: |
          for stack in react vue svelte; do
            composer validate "$stack/composer.json" --strict --no-check-publish

            for file in "$stack"/app/Lavertia/Pages/*.php "$stack"/app/Lavertia/Widgets/*.php "$stack"/app/Http/Controllers/Lavertia/*.php "$stack"/app/Http/Requests/Lavertia/*.php "$stack"/app/Policies/Lavertia*.php "$stack"/app/Models/LavertiaDemoProfile.php "$stack"/database/migrations/*lavertia_demo_profiles* "$stack"/tests/Feature/Lavertia*.php "$stack"/lang/{en,ar,fr}/lavertia.php; do
              php -l "$file"
            done
          done
      - name: Ensure generated files and public env examples are present
        run: |
          test -f react/resources/js/pages/lavertia/page.tsx
          test -f vue/resources/js/pages/lavertia/page.vue
          test -f svelte/resources/js/pages/lavertia/page.svelte
          for stack in react vue svelte; do
            test -f "$stack/.env.example"
            test ! -f "$stack/.env"
            # All three Starter Kits must respond to PHP Page and module edits.
            grep -Fq "'app/**/*.php'" "$stack/vite.config.ts"
            grep -Fq "'app-modules/*/src/**/*.php'" "$stack/vite.config.ts"
          done

  integration:
    name: Laravel + ${{ matrix.stack }}
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
    defaults:
      run:
        working-directory: playground/${{ matrix.stack }}
    steps:
      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          path: playground
      - name: Checkout support
        uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: ${{ vars.LAVERTIA_SUPPORT_REF || 'main' }}
          path: support
      - name: Checkout panels
        uses: actions/checkout@v4
        with:
          repository: lavertia/panels
          ref: main
          path: panels
      - name: Checkout forms
        uses: actions/checkout@v4
        with:
          repository: lavertia/forms
          ref: main
          path: forms
      - name: Checkout tables
        uses: actions/checkout@v4
        with:
          repository: lavertia/tables
          ref: main
          path: tables
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql
          coverage: none
          tools: composer:v2
      - name: Start PostgreSQL for database portability checks
        if: matrix.stack == 'react'
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb lavertia_test
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/${{ matrix.stack }}/package-lock.json
      - name: Install dependencies
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer show lavertia/forms
          composer show lavertia/tables
          npm ci --no-audit --no-fund
      - name: Setup Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions
          php artisan optimize:clear
          php artisan wayfinder:generate --with-form
      - name: Test authenticated component protocol
        run: php artisan test tests/Feature/LavertiaDashboardTest.php tests/Feature/LavertiaAdvancedTest.php tests/Feature/LavertiaPackageCompatibilityTest.php tests/Feature/LavertiaV03NavigationTest.php --compact
      - name: PostgreSQL authenticated feature tests
        if: matrix.stack == 'react'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: lavertia_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          SESSION_DRIVER: array
          CACHE_STORE: array
        run: |
          php artisan config:clear
          php artisan migrate:fresh --force
          php artisan test tests/Feature/LavertiaAdvancedTest.php tests/Feature/LavertiaPackageCompatibilityTest.php --compact
      - name: Verify v0.3 navigation after Laravel config and route caching
        if: matrix.stack == 'react'
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan test tests/Feature/LavertiaV03NavigationTest.php --compact
          php artisan optimize:clear
      - name: Type-check frontend
        run: npm run types:check
      - name: Build frontend
        run: npm run build

  release-gate:
    name: v0 release verification
    needs: [static, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        if: startsWith(github.ref, 'refs/tags/v0.')
        uses: actions/checkout@v4
      - name: Setup Composer
        if: startsWith(github.ref, 'refs/tags/v0.')
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Verify all three committed Composer lockfiles are current
        if: startsWith(github.ref, 'refs/tags/v0.')
        run: |
          for stack in react vue svelte; do
            composer validate "$stack/composer.json" --strict --no-check-publish
          done
      - name: Reject skipped Laravel compatibility tests
        run: |
          if [ "${{ needs.static.result }}" != "success" ] \
            || [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::v0 release blocked: React/Vue/Svelte Laravel integration must all succeed."
            exit 1
          fi
          echo "All three-stack Laravel tests passed for this tag."
