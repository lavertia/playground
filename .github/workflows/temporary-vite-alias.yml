name: Temporary Vite Plus core alias lock refresh

on:
  push:
    branches: ["fix/vite-plus-033-core-alias"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'lavertia/playground' && github.event_name == 'push' && github.ref == 'refs/heads/fix/vite-plus-033-core-alias'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vite-plus-033-core-alias
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align Vite Plus 0.3.3 with official core alias for npm
        run: |
          set -euo pipefail
          for stack in react vue svelte; do
            (
              cd "$stack"
              if node -e "const p=require('./package.json');process.exit(Object.hasOwn(p.dependencies||{},'vite')?0:1)"; then
                npm pkg set 'dependencies.vite=npm:@voidzero-dev/vite-plus-core@0.3.3'
              else
                npm pkg set 'devDependencies.vite=npm:@voidzero-dev/vite-plus-core@0.3.3'
              fi
              npm pkg set 'overrides.vite=npm:@voidzero-dev/vite-plus-core@0.3.3'
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              npm audit --audit-level=high
              npm ci --ignore-scripts --no-audit --no-fund
              node -e "const v=require('./node_modules/vite/package.json');const p=require('./node_modules/vite-plus/package.json');if(v.name!=='@voidzero-dev/vite-plus-core'||v.version!=='0.3.3'||p.version!=='0.3.3'){throw Error('Vite Plus core alias mismatch')};console.log(v.name,v.version,p.version)"
            )
          done
      - name: Commit dependency manifests only on maintenance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add react/package.json react/package-lock.json vue/package.json vue/package-lock.json svelte/package.json svelte/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(build): align Vite Plus 0.3.3 core alias in npm lockfiles'
            git push origin HEAD:fix/vite-plus-033-core-alias
          fi
