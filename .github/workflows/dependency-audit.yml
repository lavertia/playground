name: Dependency security audits

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  composer:
    name: Composer advisories / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - name: Audit committed Composer lockfile
        run: composer audit --locked --no-interaction

  npm:
    name: npm advisories / ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
    defaults:
      run:
        working-directory: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit pinned npm dependency graph
        run: npm audit --audit-level=high
