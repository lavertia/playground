name: Playground CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Validate Composer manifests and PHP
        run: |
          for stack in react vue svelte; do
            composer validate "$stack/composer.json" --no-check-publish
            php -l "$stack/app/Lavertia/Pages/DashboardPage.php"
            php -l "$stack/tests/Feature/LavertiaDashboardTest.php"
          done
      - name: Ensure generated files and public env examples are present
        run: |
          test -f react/resources/js/pages/lavertia/page.tsx
          test -f vue/resources/js/pages/lavertia/page.vue
          test -f svelte/resources/js/pages/lavertia/page.svelte
          for stack in react vue svelte; do
            test -f "$stack/.env.example"
            test ! -f "$stack/.env"
          done

  integration:
    name: Laravel + ${{ matrix.stack }}
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [react, vue, svelte]
    defaults:
      run:
        working-directory: playground/${{ matrix.stack }}
    steps:
      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          path: playground
      - name: Checkout support
        uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: ${{ vars.LAVERTIA_SUPPORT_REF || 'main' }}
          path: support
      - name: Checkout panels
        uses: actions/checkout@v4
        with:
          repository: lavertia/panels
          ref: ${{ (github.head_ref == 'feat/p0-08-resource-tabs-docs' || github.ref_name == 'feat/p0-08-resource-tabs-docs') && 'feat/p0-08-resource-tabs-docs' || (github.head_ref == 'feat/p0-07-parameterized-resource-pages' || github.ref_name == 'feat/p0-07-parameterized-resource-pages') && 'feat/p0-07-parameterized-resource-pages' || (github.head_ref == 'feat/p0-06-resource-auth-pages' || github.ref_name == 'feat/p0-06-resource-auth-pages') && 'feat/p0-06-resource-auth-pages' || (github.head_ref == 'feat/p0-05-composable-page-system' || github.ref_name == 'feat/p0-05-composable-page-system') && 'feat/p0-05-composable-page-system' || (github.head_ref == 'feat/p0-04-widget-shell-themes' || github.ref_name == 'feat/p0-04-widget-shell-themes') && 'feat/p0-04-widget-shell-themes' || (github.head_ref == 'feat/p0-03-locales-layouts' || github.ref_name == 'feat/p0-03-locales-layouts') && 'feat/p0-03-locales-layouts' || (github.head_ref == 'feat/p0-02-navigation-headers' || github.ref_name == 'feat/p0-02-navigation-headers') && 'feat/p0-02-navigation-headers' || (github.head_ref == 'feat/p0-navigation-metadata' || github.ref_name == 'feat/p0-navigation-metadata') && 'feat/p0-navigation-metadata' || (github.head_ref == 'feat/panel-shell-controls' || github.ref_name == 'feat/panel-shell-controls') && 'feat/panel-shell-controls' || vars.LAVERTIA_PANELS_REF || 'main' }}
          path: panels
      - name: Checkout Forms
        uses: actions/checkout@v4
        with:
          repository: lavertia/forms
          ref: main
          path: forms
      - name: Checkout Tables
        uses: actions/checkout@v4
        with:
          repository: lavertia/tables
          ref: main
          path: tables
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/${{ matrix.stack }}/package-lock.json
      - name: Install dependencies
        run: |
          composer config repositories.lavertia-forms '{"type":"path","url":"../../forms","options":{"symlink":true,"versions":{"lavertia/forms":"0.2.0"}}}'
          composer config repositories.lavertia-tables '{"type":"path","url":"../../tables","options":{"symlink":true,"versions":{"lavertia/tables":"0.2.0"}}}'
          composer update lavertia/panels lavertia/forms lavertia/tables --with-all-dependencies --no-interaction --prefer-dist --no-progress --no-scripts
          php artisan package:discover --ansi
          npm ci --no-audit --no-fund
      - name: Setup Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --force
          test -f database/database.sqlite || touch database/database.sqlite
          php artisan migrate --force
          mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions
          php artisan optimize:clear
          php artisan lavertia:install --stack=${{ matrix.stack }} --force
          php artisan wayfinder:generate --with-form
      - name: Test authenticated component protocol
        run: php artisan test tests/Feature/LavertiaDashboardTest.php tests/Feature/LavertiaSidebarNavigationTest.php tests/Feature/LavertiaPanelNotificationsTest.php --compact
      - name: Test composable Page variants
        if: matrix.stack == 'react'
        run: php artisan test tests/Feature/LavertiaPageVariantsTest.php --compact
      - name: Test scoped Resource and Auth Pages
        if: matrix.stack == 'react'
        run: php artisan test tests/Feature/LavertiaResourceAuthPagesTest.php --compact
      - name: Type-check frontend
        run: npm run types:check
      - name: Build frontend
        run: npm run build

  required:
    name: Three-stack runtime verification
    needs: [static, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all Laravel runtime jobs to succeed
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
