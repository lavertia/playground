name: Temporary npm security lock refresh

on:
  push:
    branches: [fix/npm-security-vite-plus-033]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'lavertia/playground' && github.ref == 'refs/heads/fix/npm-security-vite-plus-033'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated maintenance branch
        uses: actions/checkout@v6
        with:
          ref: fix/npm-security-vite-plus-033
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve non-vulnerable Vite Plus and npm lockfiles
        run: |
          set -euo pipefail
          for stack in react vue svelte; do
            (
              cd "$stack"
              npm install --save-dev --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund vite-plus@0.3.3
              npm audit --audit-level=high
            )
          done
      - name: Validate clean lockfile install, types and production builds
        run: |
          set -euo pipefail
          for stack in react vue svelte; do
            (
              cd "$stack"
              npm ci --no-audit --no-fund
              npm run types:check
              npm run build
            )
          done
      - name: Commit only audited dependency manifests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add react/package.json react/package-lock.json vue/package.json vue/package-lock.json svelte/package.json svelte/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): upgrade Vite Plus and regenerate three locked npm dependency graphs'
            git push origin HEAD:fix/npm-security-vite-plus-033
          fi
