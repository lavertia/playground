# Temporary trusted-branch job. Remove after lockfiles are committed.
name: Temporary v0.2 Composer lock refresh

on:
  push:
    branches:
      - feat/v02-rebased-public-integration

permissions:
  contents: read

jobs:
  refresh:
    if: github.repository == 'lavertia/playground' && github.ref == 'refs/heads/feat/v02-rebased-public-integration'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          path: playground
          persist-credentials: true
      - name: Checkout Support
        uses: actions/checkout@v4
        with:
          repository: lavertia/support
          ref: main
          path: support
      - name: Checkout Panels
        uses: actions/checkout@v4
        with:
          repository: lavertia/panels
          ref: main
          path: panels
      - name: Checkout Forms
        uses: actions/checkout@v4
        with:
          repository: lavertia/forms
          ref: main
          path: forms
      - name: Checkout Tables
        uses: actions/checkout@v4
        with:
          repository: lavertia/tables
          ref: main
          path: tables
      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Resolve and verify all three lockfiles
        run: |
          set -eu
          for stack in react vue svelte; do
            (
              cd "playground/$stack"
              composer update 'lavertia/*' --with-all-dependencies --no-scripts --no-interaction --prefer-dist --no-progress
              composer validate --strict --no-check-publish
              composer install --no-scripts --no-interaction --prefer-dist --no-progress
            )
          done
      - name: Commit generated Composer locks to this branch only
        run: |
          set -eu
          git -C playground config user.name "github-actions[bot]"
          git -C playground config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C playground add react/composer.lock vue/composer.lock svelte/composer.lock
          if git -C playground diff --cached --quiet; then
            echo "No lockfile changes required."
          else
            git -C playground commit -m "build: regenerate v0.2 Composer locks from public canonical packages"
            git -C playground push origin HEAD:feat/v02-rebased-public-integration
          fi
